name: CI
on: 
    push:
        branches:
        - main
    pull_request:
        branches:
        - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '24.x'
            
            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Run lint
              run: yarn lint

            - name: Run typecheck
              run: yarn typecheck

            - name: Run tests
              run: yarn test
        




