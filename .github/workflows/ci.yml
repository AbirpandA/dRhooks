name: CI
on: 
    push:
        branches:
        - main
    pull_request:
        branches:
        - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '24.x'
            
            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build registry
              run: yarn registry

            - name: Check public/r is up to date
              run: |
                  if [ -n "$(git status --porcelain public/r)" ]; then
                    echo "public/r is out of date. Run 'yarn registry' and commit the result."
                    git status --porcelain public/r
                    exit 1
                  fi

            - name: Run lint
              run: yarn lint

            - name: Run typecheck
              run: yarn typecheck

            - name: Run tests
              run: yarn test --run
        




